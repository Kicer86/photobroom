name: 'Install Linux Dependencies'
description: 'Install all system dependencies needed to build PhotoBroom on Linux'

inputs:
  extra-packages:
    description: 'Additional apt packages to install (space-separated)'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update &&              \
        sudo apt-get install                \
          ninja-build                       \
          python3-cairosvg                  \
          python3-defusedxml                \
          python3-pil                       \
          libboost-dev                      \
          libexiv2-dev                      \
          libopencv-dev                     \
          libopenblas-dev                   \
          libdlib-dev                       \
          libgmock-dev                      \
          libgl1-mesa-dev                   \
          libglvnd-dev                      \
          libwebp-dev                       \
          libqt6quick3d6                    \
          libxkbcommon-dev                  \
          qt6-base-dev                      \
          qt6-declarative-dev               \
          qt6-declarative-private-dev       \
          qt6-multimedia-dev                \
          qt6-quick3d-dev                   \
          qcoro-qt6-dev                     \
          ${{ inputs.extra-packages }}

    - name: Install CsLibGuarded
      shell: bash
      run: |
        git init cs_libguarded
        cd cs_libguarded
        git remote add origin https://github.com/copperspice/cs_libguarded.git
        git fetch --depth 1 origin 9c1e82f42f228345f3b024bed5d08be643c00f8a
        git checkout --detach FETCH_HEAD
        mkdir build
        cd build
        cmake ..
        cmake --build . --target all
        sudo cmake --build . --target install
