
name: Build-MacOS

on:
  push:
    branches:
      - master
    paths:
      - '**'
      - '!.github/workflows/**'
      - '.github/workflows/macos-build.yml'
  pull_request:
    paths:
      - '**'
      - '!.github/workflows/**'
      - '.github/workflows/macos-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build PhotoBroom sources on MacOS"

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26]

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        lfs: true

    - name: Install system dependencies
      run: |
        brew link --overwrite pkgconf
        brew install        \
          llvm              \
          ninja             \
          dlib              \
          exiv2             \
          googletest        \
          opencv            \
          qcoro6            \
          qt6

    - name: Install Python test dependencies
      run: |
        python3 -m pip install --break-system-packages Pillow
        echo "PB_PYTHON=$(command -v python3)" >> "${GITHUB_ENV}"

    - name: Configure LLVM toolchain
      run: |
        LLVM_PREFIX="$(brew --prefix llvm)"
        echo "LLVM_PREFIX=${LLVM_PREFIX}" >> "${GITHUB_ENV}"
        LLVM_CXX_LIBDIR="${LLVM_PREFIX}/lib/c++"
        if [ ! -d "${LLVM_CXX_LIBDIR}" ]; then
          LLVM_CXX_LIBDIR="${LLVM_PREFIX}/lib"
        fi
        echo "PATH=${LLVM_PREFIX}/bin:${PATH}" >> "${GITHUB_ENV}"
        echo "CC=${LLVM_PREFIX}/bin/clang" >> "${GITHUB_ENV}"
        echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "${GITHUB_ENV}"
        echo "CMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=${LLVM_PREFIX}/bin/clang-scan-deps" >> "${GITHUB_ENV}"
        SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
        echo "SDKROOT=${SDKROOT}" >> "${GITHUB_ENV}"
        echo "CMAKE_OSX_SYSROOT=${SDKROOT}" >> "${GITHUB_ENV}"
        echo "LDFLAGS=-L${LLVM_CXX_LIBDIR} -Wl,-rpath,${LLVM_CXX_LIBDIR} -L${LLVM_PREFIX}/lib -Wl,-rpath,${LLVM_PREFIX}/lib -lc++ -lc++abi" >> "${GITHUB_ENV}"
        echo "CPPFLAGS=-I${LLVM_PREFIX}/include" >> "${GITHUB_ENV}"
        echo "CXXFLAGS=-nostdlib++ -stdlib=libc++" >> "${GITHUB_ENV}"

    - name: Report toolchain
      run: |
        xcodebuild -version
        cmake --version
        "${CC}" --version
        "${CXX}" --version

    - name: Install CsLibGuarded
      run: |
        git init cs_libguarded
        cd cs_libguarded
        git remote add origin https://github.com/copperspice/cs_libguarded.git
        git fetch --depth 1 origin 9c1e82f42f228345f3b024bed5d08be643c00f8a
        git checkout --detach FETCH_HEAD
        mkdir build
        cd build
        cmake ..
        cmake --build . --target all
        sudo cmake --build . --target install

    - name: Build
      uses: ashutoshvarma/action-cmake-build@master
      with:
        build-dir: ${{ runner.workspace }}/build
        build-type: Release
        configure-options:
            -DCMAKE_C_COMPILER=${{ env.CC }}
            -DCMAKE_CXX_COMPILER=${{ env.CXX }}
            -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=${{ env.CMAKE_CXX_COMPILER_CLANG_SCAN_DEPS }}
            -DCMAKE_OSX_SYSROOT=${{ env.CMAKE_OSX_SYSROOT }}
            -DPython=${{ env.PB_PYTHON }}
            -DBUILD_TESTING=ON
            -DBUILD_SHARED_LIBS=ON
            -G Ninja
        run-test: true
        ctest-options:
            --output-on-failure
      env:
        VERBOSE: 1
        QT_QPA_PLATFORM: offscreen

  build-result:
    name: "macOS build matrix"
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
    - name: Verify build matrix result
      env:
        BUILD_RESULT: ${{ needs.build.result }}
      run: |
        echo "Build matrix result: ${BUILD_RESULT}"
        test "${BUILD_RESULT}" = "success"
