
name: Code coverage

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: "Unit tests coverage"
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        lfs: true

    - name: Install dependencies
      uses: ./.github/actions/linux-deps
      with:
        extra-packages: gcc g++ lcov

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.job }}

    - name: Build
      uses: ashutoshvarma/action-cmake-build@master
      with:
        build-dir: ${{ runner.workspace }}/build
        build-type: Debug
        cc: gcc
        cxx: g++
        configure-options:
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            -DENABLE_SANITIZERS_FOR_TESTS=FALSE
            -DBUILD_LEARNING_TESTS=TRUE
            -DPython=/usr/bin/python3
            -DCMAKE_CXX_FLAGS=--coverage
            -DCMAKE_SHARED_LINKER_FLAGS=--coverage
            -DCMAKE_EXE_LINKER_FLAGS=--coverage
            -G Ninja

    - name: Install face recognition models for tests
      run: |
        sudo mkdir -p /usr/local/share/photo_broom/face_recognition_models
        sudo cp src/face_recognition/dlib_wrapper/face_recognition_models/face_recognition_models/models/*.dat \
               /usr/local/share/photo_broom/face_recognition_models/

    - name: Run tests
      run: |
        cd ${{ runner.workspace }}/build
        /usr/local/bin/ctest -C Debug --output-on-failure

    - name: Generate lcov raports
      continue-on-error: true
      run: |
        lcov --capture --gcov-tool gcov                 \
            --ignore-errors mismatch,inconsistent       \
            --rc geninfo_unexecuted_blocks=1            \
            --directory ${{ runner.workspace }}/build   \
            --output-file coverage.info
        lcov --gcov-tool gcov --remove coverage.info '/usr/*' --output-file coverage.info
        lcov --list coverage.info

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v6
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
