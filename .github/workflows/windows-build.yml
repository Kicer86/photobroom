
name: Build-Windows

on:
  push:
    branches:
      - master
    paths:
      - '**'
      - '!.github/workflows/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - '**'
      - '!.github/workflows/**'
      - '.github/workflows/windows-build.yml'
  # Manual runs exercise the latest Windows and MSVC image; push and PR builds stay on Windows 2022.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


env:
  # Workaround for lukka/run-vcpkg cache issue (#251): use vcpkg binary cache stored via actions/cache.
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg-binary-cache,readwrite"
  # Workaround to avoid re-downloading sources every run while run-vcpkg caching is unreliable.
  VCPKG_DOWNLOADS: "${{ github.workspace }}\\vcpkg-downloads"

jobs:
  build-dependencies:
    name: "Build PhotoBroom dependencies for Windows"
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'windows-2025' || 'windows-2022' }}
    strategy:
      fail-fast: true

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Restore vcpkg binary cache
      # Workaround for run-vcpkg cache instability: persist vcpkg binaries/downloads between jobs.
      uses: actions/cache/restore@v6
      with:
        path: |
          vcpkg-binary-cache
          vcpkg-downloads
        key: vcpkg-binary-${{ runner.os }}-${{ hashFiles('vcpkg.json', '.github/vcpkg_overlays/**') }}-${{ github.run_id }}
        restore-keys: |
          vcpkg-binary-${{ runner.os }}-${{ hashFiles('vcpkg.json', '.github/vcpkg_overlays/**') }}-
          vcpkg-binary-${{ runner.os }}-

    - name: Run vcpkg
      uses: lukka/run-vcpkg@v11.6
      with:
        vcpkgJsonGlob: vcpkg.json

    - name: Report toolchain
      shell: pwsh
      run: |
        & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationVersion
        cmake --version
        git -C vcpkg rev-parse HEAD

    # Build dependencies via CMake configure (not raw vcpkg install) to ensure
    # the compiler hash matches the one produced by build-photo-broom jobs.
    # A raw `vcpkg install` detects the compiler differently than `run-cmake`,
    # causing ABI hash mismatch and 0 cache hits in downstream jobs.
    # Use short buildtrees root to avoid long path issues with qtdeclarative (microsoft/vcpkg#47075).
    - name: Build dependencies
      uses: lukka/run-cmake@v10
      with:
        configurePreset: ninja-vcpkg-release
        configurePresetAdditionalArgs: |
            [
                '-DBUILD_TESTING=OFF',
                '-DBUILD_SHARED_LIBS=TRUE',
                '-DVCPKG_INSTALL_OPTIONS=--x-buildtrees-root=D:/bt;--clean-buildtrees-after-build;--clean-packages-after-build'
            ]

    - name: Save vcpkg binary cache
      if: always()
      uses: actions/cache/save@v6
      with:
        path: |
          vcpkg-binary-cache
          vcpkg-downloads
        key: vcpkg-binary-${{ runner.os }}-${{ hashFiles('vcpkg.json', '.github/vcpkg_overlays/**') }}-${{ github.run_id }}


  build-photo-broom:
    name: "Build PhotoBroom sources on Windows"
    needs: build-dependencies
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'windows-2025' || 'windows-2022' }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "debug"
            cmake_config: "ninja-vcpkg-debug"
            cmake_build: "ninja-vcpkg-debug"
          - name: "release"
            cmake_config: "ninja-vcpkg-release"
            cmake_build: "ninja-vcpkg-release"

    steps:
    - name: Print setup
      run: |
        echo "image: $env:ImageOS $env:ImageVersion"
        echo "config: ${{ matrix.config.cmake_config }}"
        echo "build: ${{ matrix.config.cmake_build }}"

    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Restore vcpkg binary cache
      # Workaround for run-vcpkg cache instability: reuse binaries/downloads in build job.
      uses: actions/cache@v6
      with:
        path: |
          vcpkg-binary-cache
          vcpkg-downloads
        key: vcpkg-binary-${{ runner.os }}-${{ hashFiles('vcpkg.json', '.github/vcpkg_overlays/**') }}-${{ github.run_id }}
        restore-keys: |
          vcpkg-binary-${{ runner.os }}-${{ hashFiles('vcpkg.json', '.github/vcpkg_overlays/**') }}-
          vcpkg-binary-${{ runner.os }}-

#    modules are not supported by ccache and it causes problems
#    - name: Setup ccache
#      uses: Chocobo1/setup-ccache-action@v1
#      with:
#        windows_compile_environment: msvc

    - name: Run vcpkg
      uses: lukka/run-vcpkg@v11.6
      with:
        vcpkgJsonGlob: vcpkg.json

    - name: Build
      timeout-minutes: 30
      uses: lukka/run-cmake@v10
      with:
        configurePreset: ${{ matrix.config.cmake_config }}
        # Debug symbols are not published from CI. Avoid generating module PDBs: MSVC can hang while
        # merging debug information for database_sqlite_plugin.dll.
        configurePresetAdditionalArgs: |
            [
                '-DBUILD_TESTING=OFF',
                '-DBUILD_SHARED_LIBS=TRUE',
                '-DCMAKE_MODULE_LINKER_FLAGS_DEBUG=/DEBUG:NONE /INCREMENTAL:NO',
                '-DVCPKG_INSTALL_OPTIONS=--x-buildtrees-root=D:/bt'
            ]
        buildPreset: "${{ matrix.config.cmake_build }}"

    - name: Install NSIS (for CPack)
      if: matrix.config.name == 'release'
      # CPack NSIS generator requires makensis on PATH.
      run: choco install -y nsis

    - name: Make package
      if: matrix.config.name == 'release'
      # Workaround: run-cmake sets up the MSVC env; a raw cmake --build doesn't.
      uses: lukka/run-cmake@v10
      with:
        configurePreset: ${{ matrix.config.cmake_config }}
        buildPreset: "${{ matrix.config.cmake_build }}"
        buildPresetAdditionalArgs: |
            [
                "--target",
                "package"
            ]

    - name: Upload artifact
      if: matrix.config.name == 'release'
      uses: actions/upload-artifact@v7
      with:
        name: Installer
        path: out/build/ninja-vcpkg-release/PhotoBroom-*-win64.exe


  build-arm64:
    name: "Build PhotoBroom sources on Windows ARM64"
    runs-on: windows-11-arm
    env:
      VCPKG_DEFAULT_TRIPLET: arm64-windows
      VCPKG_DEFAULT_HOST_TRIPLET: arm64-windows

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Restore vcpkg binary cache
      # vcpkg no longer supports the x-gha binary-cache backend (lukka/run-vcpkg#251).
      uses: actions/cache/restore@v6
      with:
        path: |
          vcpkg-binary-cache
          vcpkg-downloads
        key: vcpkg-binary-${{ runner.os }}-arm64-windows-${{ hashFiles('vcpkg.json', '.github/vcpkg_overlays/**') }}-${{ github.run_id }}
        restore-keys: |
          vcpkg-binary-${{ runner.os }}-arm64-windows-${{ hashFiles('vcpkg.json', '.github/vcpkg_overlays/**') }}-
          vcpkg-binary-${{ runner.os }}-arm64-windows-

    - name: Print setup
      run: |
        echo "image: $env:ImageOS $env:ImageVersion"
        echo "triplet: $env:VCPKG_DEFAULT_TRIPLET"

    - name: Run vcpkg
      uses: lukka/run-vcpkg@v11.6
      with:
        vcpkgJsonGlob: vcpkg.json
        doNotCache: false

    - name: Report toolchain
      shell: pwsh
      run: |
        & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationVersion
        cmake --version
        git -C vcpkg rev-parse HEAD

    - name: Prepare vcpkg build directory
      shell: pwsh
      run: New-Item -ItemType Directory -Force -Path C:\bt

    - name: Build
      uses: lukka/run-cmake@v10
      with:
        configurePreset: ninja-vcpkg-release
        configurePresetAdditionalArgs: |
            [
                '-DBUILD_TESTING=OFF',
                '-DBUILD_SHARED_LIBS=TRUE',
                '-DVCPKG_TARGET_TRIPLET=arm64-windows',
                '-DVCPKG_INSTALL_OPTIONS=--x-buildtrees-root=C:/bt;--clean-buildtrees-after-build;--clean-packages-after-build'
            ]
        buildPreset: ninja-vcpkg-release

    - name: Save vcpkg binary cache
      if: always()
      uses: actions/cache/save@v6
      with:
        path: |
          vcpkg-binary-cache
          vcpkg-downloads
        key: vcpkg-binary-${{ runner.os }}-arm64-windows-${{ hashFiles('vcpkg.json', '.github/vcpkg_overlays/**') }}-${{ github.run_id }}


  test-installation:
    name: "Windows installer verification"
    needs: build-photo-broom
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'windows-2025' || 'windows-2022' }}
    steps:
      - uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: Installer
          path: ./installer

      - name: Verify list of files in installer
        run: |
          $installerPath = Get-ChildItem -Path ./installer -Filter PhotoBroom-*-win64.exe | Select-Object -ExpandProperty FullName
          7z l $installerPath | python .github/parse7z-l.py | python .github/compare.py

      - name: Install application
        run: |
          $installerPath = Get-ChildItem -Path ./installer -Filter PhotoBroom-*-win64.exe | Select-Object -ExpandProperty FullName
          Start-Process -FilePath $installerPath -ArgumentList '/S' -Wait

      - name: Check dependencies
        run: |
          pip install pefile
          python .github/dependencies_validator.py "C:\\Program Files\\PhotoBroom\\Photo_Broom.exe"
